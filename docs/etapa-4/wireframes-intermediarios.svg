<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="860" viewBox="0 0 1900 860" role="img" aria-labelledby="title desc">
  <title id="title">Wireframes intermediários do novo visualizador ED Viz em 1024px e 768px</title>
  <desc id="desc">Em 1024px, roteiro e prancha permanecem visíveis e a margem abre como folha lateral. Em 768px, a prancha ocupa a largura toda e código e leitura abrem como folhas.</desc>
  <style>
    .bg { fill: #09090D; }
    .surface { fill: #0D0D12; }
    .raised { fill: #111118; }
    .hair { stroke: #1E1E29; stroke-width: 1; fill: none; }
    .hair-strong { stroke: #292936; stroke-width: 1; fill: none; }
    .grid { stroke: #14141C; stroke-width: 1; }
    .txt { fill: #E7E5ED; font-family: Geist, "Segoe UI", sans-serif; }
    .sec { fill: #C4C3CF; font-family: Geist, "Segoe UI", sans-serif; }
    .mut { fill: #9696A5; font-family: Geist, "Segoe UI", sans-serif; }
    .mono { fill: #C4C3CF; font-family: "Geist Mono", Consolas, monospace; }
    .mono-mut { fill: #9696A5; font-family: "Geist Mono", Consolas, monospace; }
    .ocean { fill: #35B8C8; }
    .ocean-txt { fill: #9CE6ED; }
    .label { font-family: "Geist Mono", Consolas, monospace; font-size: 9px; letter-spacing: 1.2px; fill: #9696A5; }
    .small { font-size: 9px; }
    .body { font-size: 11px; }
    .title { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
    .code { font-family: "Geist Mono", Consolas, monospace; font-size: 10px; fill: #C4C3CF; }
    .code-mut { font-family: "Geist Mono", Consolas, monospace; font-size: 10px; fill: #656575; }
    .btn { fill: #35B8C8; }
    .btn-txt { fill: #09090D; font-family: Geist, "Segoe UI", sans-serif; font-size: 10px; font-weight: 600; }
    .ghost { fill: none; stroke: #292936; }
    .cell { fill: #111118; stroke: #292936; }
    .cell-active { fill: #12343A; stroke: #35B8C8; stroke-width: 1.4; }
    .frame-label { font-family: "Geist Mono", Consolas, monospace; font-size: 11px; letter-spacing: 0.6px; fill: #9696A5; }
    .frame { fill: #09090D; stroke: #292936; stroke-width: 1; }
  </style>

  <rect class="bg" width="1900" height="860"/>

  <text class="frame-label" x="30" y="30">1024 · ROTEIRO + PRANCHA + MARGEM EM FOLHA</text>
  <text class="frame-label" x="1090" y="30">768 · PRANCHA + FOLHAS SOB DEMANDA</text>

  <!-- ================= 1024 frame ================= -->
  <g transform="translate(30,50)">
    <rect class="frame" width="1024" height="780" rx="8"/>

    <!-- running head -->
    <rect class="surface" x="0" y="0" width="1024" height="44"/>
    <line class="hair" x1="0" y1="44" x2="1024" y2="44"/>
    <circle cx="20" cy="22" r="6" fill="none" stroke="#35B8C8" stroke-width="1.3"/>
    <circle cx="20" cy="22" r="2" fill="#35B8C8"/>
    <text class="txt" x="32" y="26" font-size="12" font-weight="600">ED Viz</text>
    <text class="mut small" x="86" y="26">Guia</text>
    <text class="mut small" x="930" y="26" text-anchor="end">Ajuda</text>
    <rect x="958" y="12" width="50" height="20" rx="4" class="ghost"/>
    <text class="mono-mut small" x="983" y="26" text-anchor="middle">⌘K</text>

    <!-- script -->
    <rect class="surface" x="0" y="44" width="360" height="736"/>
    <line class="hair" x1="360" y1="44" x2="360" y2="780"/>

    <text class="label" x="14" y="62">ROTEIRO</text>
    <rect x="14" y="72" width="176" height="26" rx="5" class="raised"/>
    <text class="sec small" x="24" y="89">Pilha com array</text>
    <text class="mut small" x="176" y="89">▾</text>
    <rect x="198" y="72" width="82" height="28" rx="5" class="btn"/>
    <text class="btn-txt" x="239" y="90" text-anchor="middle">▶ Executar</text>
    <rect x="288" y="72" width="28" height="26" rx="5" class="ghost"/>
    <text class="mut small" x="302" y="89" text-anchor="middle">⌁</text>

    <line class="hair" x1="0" y1="110" x2="360" y2="110"/>
    <text class="txt small" x="14" y="130">pilha-array.js</text>
    <line x1="12" y1="138" x2="98" y2="138" stroke="#35B8C8" stroke-width="2"/>
    <text class="mut small" x="112" y="130">fila-array.js</text>
    <text class="mut small" x="194" y="130">×</text>
    <line class="hair" x1="0" y1="140" x2="360" y2="140"/>

    <rect x="0" y="140" width="38" height="596" fill="#0A0A0F"/>
    <line class="hair" x1="38" y1="140" x2="38" y2="736"/>
    <text class="code-mut" x="30" y="162" text-anchor="end">1</text>
    <text class="code-mut" x="30" y="184" text-anchor="end">2</text>
    <text class="code-mut" x="30" y="206" text-anchor="end">3</text>
    <text class="code-mut" x="30" y="228" text-anchor="end">4</text>
    <text class="code-mut" x="30" y="250" text-anchor="end">5</text>
    <text class="code-mut" x="30" y="272" text-anchor="end">6</text>
    <text class="code-mut" x="30" y="294" text-anchor="end">7</text>
    <text class="code-mut" x="30" y="316" text-anchor="end">8</text>
    <text class="code-mut" x="30" y="338" text-anchor="end">9</text>
    <text class="code" x="50" y="162">// PILHA — LIFO</text>
    <text class="code" x="50" y="184">const pilha = [];</text>
    <text class="code" x="50" y="228">pilha.push(10);</text>
    <text class="code" x="50" y="250">pilha.push(20);</text>
    <text class="code ocean-txt" x="50" y="272">pilha.push(30);</text>
    <text class="code" x="50" y="316">const topo = pilha[2];</text>
    <rect x="38" y="256" width="322" height="22" fill="#12343A" opacity="0.55"/>
    <rect x="38" y="256" width="2" height="22" fill="#35B8C8"/>
    <text class="ocean-txt" x="30" y="272" text-anchor="end" font-family="Geist Mono, Consolas, monospace" font-size="10">9</text>

    <line class="hair" x1="0" y1="736" x2="360" y2="736"/>
    <text class="mono-mut small" x="14" y="755">linha 9: pilha.push(30);</text>

    <!-- plate -->
    <rect class="bg" x="360" y="44" width="664" height="736"/>
    <text class="title txt" x="384" y="74">Pilha</text>
    <text class="mono-mut small" x="430" y="74">3 itens</text>
    <text class="mono ocean-txt small" x="482" y="74">· push(30)</text>
    <text class="mono-mut small" x="698" y="74" text-anchor="end">automático ▾</text>
    <circle cx="714" cy="70" r="2.5" fill="#9696A5"/>
    <text class="mono-mut small" x="722" y="74">pausado</text>
    <text class="ocean-txt small" x="990" y="74" text-anchor="end">Leitura ›</text>
    <text class="mut small" x="1010" y="74">⋯</text>
    <line class="hair" x1="360" y1="92" x2="1024" y2="92"/>

    <g class="grid">
      <line x1="420" y1="92" x2="420" y2="712"/><line x1="480" y1="92" x2="480" y2="712"/>
      <line x1="540" y1="92" x2="540" y2="712"/><line x1="600" y1="92" x2="600" y2="712"/>
      <line x1="660" y1="92" x2="660" y2="712"/><line x1="720" y1="92" x2="720" y2="712"/>
      <line x1="780" y1="92" x2="780" y2="712"/><line x1="840" y1="92" x2="840" y2="712"/>
      <line x1="900" y1="92" x2="900" y2="712"/><line x1="960" y1="92" x2="960" y2="712"/>
      <line x1="360" y1="160" x2="1024" y2="160"/><line x1="360" y1="230" x2="1024" y2="230"/>
      <line x1="360" y1="300" x2="1024" y2="300"/><line x1="360" y1="370" x2="1024" y2="370"/>
      <line x1="360" y1="440" x2="1024" y2="440"/><line x1="360" y1="510" x2="1024" y2="510"/>
      <line x1="360" y1="580" x2="1024" y2="580"/><line x1="360" y1="650" x2="1024" y2="650"/>
    </g>

    <rect class="cell-active" x="520" y="280" width="200" height="52" rx="4"/>
    <text class="mono-mut small" x="534" y="311">[2]</text>
    <text class="mono ocean-txt" x="596" y="312" font-size="16" font-weight="600">30</text>
    <text class="mono ocean-txt small" x="644" y="311">← topo</text>
    <rect class="cell" x="520" y="332" width="200" height="52" rx="4"/>
    <text class="mono-mut small" x="534" y="363">[1]</text>
    <text class="mono" x="596" y="364" font-size="16" font-weight="600">20</text>
    <rect class="cell" x="520" y="384" width="200" height="52" rx="4"/>
    <text class="mono-mut small" x="534" y="415">[0]</text>
    <text class="mono" x="596" y="416" font-size="16" font-weight="600">10</text>
    <text class="mono-mut small" x="620" y="462" text-anchor="middle">BASE</text>

    <!-- reading sheet inside the plate, above the ruler -->
    <rect x="360" y="500" width="664" height="250" fill="#0D0D12"/>
    <line class="hair-strong" x1="360" y1="500" x2="1024" y2="500"/>
    <rect x="680" y="510" width="24" height="3" rx="1.5" fill="#393947"/>
    <text class="label" x="378" y="532">LEITURA</text>
    <text class="mono-mut small" x="900" y="532">passo 5/10</text>
    <text class="mut small" x="1004" y="532">×</text>
    <line class="hair" x1="360" y1="542" x2="1024" y2="542"/>

    <text class="label" x="378" y="566">PASSO</text>
    <text class="mono ocean-txt small" x="378" y="586">push(30)</text>
    <text class="sec body" x="430" y="586">30 entrou no topo. A pilha passou de 2 para 3 itens.</text>
    <rect x="378" y="598" width="300" height="26" rx="4" class="bg"/>
    <text class="code-mut" x="388" y="615">9</text>
    <text class="code" x="404" y="615">pilha.push(30);</text>

    <text class="txt small" x="720" y="586">Variáveis</text>
    <line x1="720" y1="594" x2="774" y2="594" stroke="#35B8C8" stroke-width="2"/>
    <text class="mut small" x="794" y="586">Chamadas</text>
    <text class="mut small" x="880" y="586">Estrutura</text>
    <line class="hair" x1="360" y1="630" x2="1024" y2="630"/>

    <text class="mono" x="378" y="654">▾ pilha</text>
    <text class="mono-mut small" x="700" y="654" text-anchor="end">Array(3)</text>
    <text class="mono-mut" x="400" y="676">0</text>
    <text class="mono" x="432" y="676">10</text>
    <text class="mono-mut" x="400" y="698">1</text>
    <text class="mono" x="432" y="698">20</text>
    <text class="mono-mut" x="400" y="720">2</text>
    <text class="mono ocean-txt" x="432" y="720">30</text>
    <text class="mono" x="740" y="654">▸ this</text>
    <text class="mono-mut small" x="1000" y="654" text-anchor="end">Pilha</text>

    <text class="mono-mut small" x="378" y="742">O desenho permanece visível acima; a régua continua acessível abaixo.</text>

    <rect class="surface" x="360" y="750" width="664" height="30"/>
    <line class="hair" x1="360" y1="750" x2="1024" y2="750"/>
    <text class="mut small" x="376" y="770">◀</text>
    <circle cx="404" cy="766" r="10" fill="#35B8C8"/>
    <text x="404" y="770" text-anchor="middle" fill="#09090D" font-size="9">▶</text>
    <text class="mut small" x="424" y="770">▶</text>
    <text class="mono-mut small" x="446" y="770">5/10</text>
    <line x1="486" y1="766" x2="760" y2="766" stroke="#292936" stroke-width="3" stroke-linecap="round"/>
    <line x1="486" y1="766" x2="598" y2="766" stroke="#35B8C8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="598" cy="766" r="5" fill="#35B8C8"/>
    <text class="mono-mut small" x="790" y="770">1×</text>
    <text class="mono ocean-txt small" x="1006" y="770" text-anchor="end">Registro ↑</text>
  </g>

  <!-- ================= 768 frame ================= -->
  <g transform="translate(1090,50)">
    <rect class="frame" width="768" height="780" rx="8"/>

    <rect class="surface" x="0" y="0" width="768" height="44"/>
    <line class="hair" x1="0" y1="44" x2="768" y2="44"/>
    <circle cx="20" cy="22" r="6" fill="none" stroke="#35B8C8" stroke-width="1.3"/>
    <text class="txt" x="32" y="26" font-size="12" font-weight="600">ED Viz</text>
    <text class="mut small" x="86" y="26">Guia</text>
    <text class="mut small" x="690" y="26" text-anchor="middle">&lt;/&gt;</text>
    <text class="mut small" x="720" y="26" text-anchor="middle">▤</text>
    <text class="mut small" x="748" y="26" text-anchor="middle">?</text>

    <text class="title txt" x="16" y="72">Pilha</text>
    <text class="mono-mut small" x="58" y="72">3 itens</text>
    <circle cx="112" cy="68" r="2.5" fill="#9696A5"/>
    <text class="mono-mut small" x="120" y="72">pausado</text>
    <text class="mono-mut small" x="700" y="72" text-anchor="end">automático ▾</text>
    <text class="mut small" x="746" y="72" text-anchor="middle">⋯</text>
    <line class="hair" x1="0" y1="92" x2="768" y2="92"/>

    <g class="grid">
      <line x1="64" y1="92" x2="64" y2="660"/><line x1="128" y1="92" x2="128" y2="660"/>
      <line x1="192" y1="92" x2="192" y2="660"/><line x1="256" y1="92" x2="256" y2="660"/>
      <line x1="320" y1="92" x2="320" y2="660"/><line x1="384" y1="92" x2="384" y2="660"/>
      <line x1="448" y1="92" x2="448" y2="660"/><line x1="512" y1="92" x2="512" y2="660"/>
      <line x1="576" y1="92" x2="576" y2="660"/><line x1="640" y1="92" x2="640" y2="660"/>
      <line x1="704" y1="92" x2="704" y2="660"/>
      <line x1="0" y1="170" x2="768" y2="170"/><line x1="0" y1="250" x2="768" y2="250"/>
      <line x1="0" y1="330" x2="768" y2="330"/><line x1="0" y1="410" x2="768" y2="410"/>
      <line x1="0" y1="490" x2="768" y2="490"/><line x1="0" y1="570" x2="768" y2="570"/>
    </g>

    <rect class="cell-active" x="286" y="300" width="196" height="52" rx="4"/>
    <text class="mono-mut small" x="300" y="331">[2]</text>
    <text class="mono ocean-txt" x="360" y="332" font-size="16" font-weight="600">30</text>
    <text class="mono ocean-txt small" x="408" y="331">← topo</text>
    <rect class="cell" x="286" y="352" width="196" height="52" rx="4"/>
    <text class="mono-mut small" x="300" y="383">[1]</text>
    <text class="mono" x="360" y="384" font-size="16" font-weight="600">20</text>
    <rect class="cell" x="286" y="404" width="196" height="52" rx="4"/>
    <text class="mono-mut small" x="300" y="435">[0]</text>
    <text class="mono" x="360" y="436" font-size="16" font-weight="600">10</text>
    <text class="mono-mut small" x="384" y="482" text-anchor="middle">BASE</text>

    <line class="hair" x1="0" y1="660" x2="768" y2="660"/>
    <rect class="surface" x="0" y="660" width="768" height="40"/>
    <circle cx="18" cy="680" r="3" fill="#35B8C8"/>
    <text class="label" x="28" y="684">PASSO</text>
    <text class="sec body" x="78" y="684">push(30) · 30 entrou no topo.</text>
    <text class="mut small" x="742" y="684" text-anchor="middle">›</text>

    <rect class="surface" x="0" y="700" width="768" height="54"/>
    <line class="hair" x1="0" y1="700" x2="768" y2="700"/>
    <text class="mut" x="20" y="730">⏮</text>
    <text class="mut" x="44" y="730">◀</text>
    <circle cx="76" cy="726" r="12" fill="#35B8C8"/>
    <text x="76" y="730" text-anchor="middle" fill="#09090D" font-size="10">▶</text>
    <text class="mut" x="102" y="730">▶</text>
    <text class="mut" x="126" y="730">⏭</text>
    <text class="mono-mut small" x="156" y="730">5/10</text>
    <line x1="200" y1="726" x2="600" y2="726" stroke="#292936" stroke-width="3" stroke-linecap="round"/>
    <line x1="200" y1="726" x2="360" y2="726" stroke="#35B8C8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="360" cy="726" r="5" fill="#35B8C8"/>
    <text class="mono-mut small" x="632" y="730">1×</text>
    <text class="mono ocean-txt small" x="748" y="730" text-anchor="end">Registro ↑</text>

    <text class="mono-mut small" x="16" y="774">Código e Leitura abrem como folhas; uma por vez.</text>
  </g>
</svg>
