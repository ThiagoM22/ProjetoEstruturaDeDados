<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe desktop do novo visualizador ED Viz em 1440px</title>
  <desc id="desc">Três zonas: roteiro de código à esquerda, prancha da estrutura ao centro com legenda do passo e régua de reprodução, e margem de leitura à direita.</desc>
  <style>
    .bg { fill: #09090D; }
    .surface { fill: #0D0D12; }
    .raised { fill: #111118; }
    .panel { fill: #0A0A0F; }
    .hair { stroke: #1E1E29; stroke-width: 1; fill: none; }
    .hair-strong { stroke: #292936; stroke-width: 1; fill: none; }
    .grid { stroke: #14141C; stroke-width: 1; }
    .txt { fill: #E7E5ED; font-family: Geist, "Segoe UI", sans-serif; }
    .sec { fill: #C4C3CF; font-family: Geist, "Segoe UI", sans-serif; }
    .mut { fill: #9696A5; font-family: Geist, "Segoe UI", sans-serif; }
    .mono { fill: #C4C3CF; font-family: "Geist Mono", Consolas, monospace; }
    .mono-mut { fill: #9696A5; font-family: "Geist Mono", Consolas, monospace; }
    .ocean { fill: #35B8C8; }
    .ocean-txt { fill: #9CE6ED; }
    .label { font-family: "Geist Mono", Consolas, monospace; font-size: 10px; letter-spacing: 1.4px; fill: #9696A5; }
    .small { font-size: 10px; }
    .body { font-size: 12px; }
    .title { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
    .code { font-family: "Geist Mono", Consolas, monospace; font-size: 11px; fill: #C4C3CF; }
    .code-mut { font-family: "Geist Mono", Consolas, monospace; font-size: 11px; fill: #656575; }
    .btn { fill: #35B8C8; }
    .btn-txt { fill: #09090D; font-family: Geist, "Segoe UI", sans-serif; font-size: 11px; font-weight: 600; }
    .ghost { fill: none; stroke: #292936; }
    .cell { fill: #111118; stroke: #292936; }
    .cell-active { fill: #12343A; stroke: #35B8C8; stroke-width: 1.5; }
    .dash { stroke: #393947; stroke-dasharray: 4 4; fill: none; }
  </style>

  <rect class="bg" width="1440" height="920"/>

  <!-- running head -->
  <rect class="surface" x="0" y="0" width="1440" height="44"/>
  <line class="hair" x1="0" y1="44" x2="1440" y2="44"/>
  <circle cx="22" cy="22" r="7" fill="none" stroke="#35B8C8" stroke-width="1.4"/>
  <circle cx="22" cy="22" r="2" fill="#35B8C8"/>
  <text class="txt" x="36" y="26" font-size="13" font-weight="600">ED Viz</text>
  <text class="mut body" x="96" y="26">Guia</text>
  <text class="mut body" x="1215" y="26" text-anchor="end">Código</text>
  <text class="ocean-txt body" x="1275" y="26" text-anchor="end">Leitura</text>
  <text class="mut body" x="1330" y="26" text-anchor="end">Ajuda</text>
  <rect x="1360" y="12" width="58" height="20" rx="4" class="ghost"/>
  <text class="mono-mut small" x="1389" y="26" text-anchor="middle">⌘ K</text>

  <!-- 1 · script -->
  <rect class="surface" x="0" y="44" width="480" height="856"/>
  <line class="hair" x1="480" y1="44" x2="480" y2="900"/>

  <text class="label" x="18" y="62">ROTEIRO</text>
  <rect x="18" y="72" width="206" height="28" rx="6" class="raised"/>
  <text class="sec small" x="28" y="90">Pilha com array (push/pop)</text>
  <text class="mut small" x="208" y="90">▾</text>
  <rect x="232" y="71" width="92" height="30" rx="6" class="btn"/>
  <text class="btn-txt" x="278" y="90" text-anchor="middle">▶ Executar</text>
  <rect x="332" y="72" width="30" height="28" rx="6" class="ghost"/>
  <text class="mut small" x="347" y="90" text-anchor="middle">⌁</text>
  <rect x="432" y="72" width="30" height="28" rx="6" class="ghost"/>
  <text class="mut small" x="447" y="90" text-anchor="middle">‹</text>

  <!-- tabs -->
  <line class="hair" x1="0" y1="118" x2="480" y2="118"/>
  <text class="txt small" x="18" y="140">pilha-array.js</text>
  <line x1="16" y1="150" x2="112" y2="150" stroke="#35B8C8" stroke-width="2"/>
  <text class="mut small" x="132" y="140">fila-array.js</text>
  <text class="mut small" x="228" y="140">×</text>
  <line class="hair" x1="0" y1="152" x2="480" y2="152"/>

  <!-- editor -->
  <rect x="0" y="152" width="44" height="714" fill="#0A0A0F"/>
  <line class="hair" x1="44" y1="152" x2="44" y2="866"/>
  <text class="code-mut" x="34" y="174" text-anchor="end">1</text>
  <text class="code-mut" x="34" y="196" text-anchor="end">2</text>
  <text class="code-mut" x="34" y="218" text-anchor="end">3</text>
  <text class="code-mut" x="34" y="240" text-anchor="end">4</text>
  <text class="code-mut" x="34" y="262" text-anchor="end">5</text>
  <text class="code-mut" x="34" y="284" text-anchor="end">6</text>
  <text class="code-mut" x="34" y="306" text-anchor="end">7</text>
  <text class="code-mut" x="34" y="328" text-anchor="end">8</text>
  <text class="code-mut" x="34" y="350" text-anchor="end">9</text>
  <text class="code-mut" x="34" y="372" text-anchor="end">10</text>
  <text class="code-mut" x="34" y="394" text-anchor="end">11</text>
  <text class="code-mut" x="34" y="416" text-anchor="end">12</text>

  <text class="code-mut" x="58" y="174">// PILHA (stack) — LIFO</text>
  <text class="code" x="58" y="196">const pilha = [];</text>
  <text class="code-mut" x="58" y="240">// empilha no topo</text>
  <text class="code" x="58" y="262">pilha.push(10);</text>
  <text class="code" x="58" y="284">pilha.push(20);</text>
  <text class="code ocean-txt" x="58" y="306">pilha.push(30);</text>
  <text class="code" x="58" y="350">const topo = pilha[pilha.length - 1];</text>
  <text class="code" x="58" y="394">console.log('Topo:', topo);</text>
  <text class="code" x="58" y="438">pilha.pop();</text>

  <!-- active line -->
  <rect x="44" y="290" width="436" height="22" fill="#12343A" opacity="0.55"/>
  <rect x="44" y="290" width="2" height="22" fill="#35B8C8"/>
  <text class="ocean-txt" x="34" y="306" text-anchor="end" font-family="Geist Mono, Consolas, monospace" font-size="11">9</text>

  <!-- status -->
  <line class="hair" x1="0" y1="866" x2="480" y2="866"/>
  <text class="mono-mut small" x="18" y="884">linha 9: pilha.push(30);</text>
  <text class="mono-mut small" x="462" y="884" text-anchor="end">Ctrl+Enter</text>

  <!-- 2 · plate -->
  <rect class="bg" x="480" y="44" width="660" height="856"/>

  <!-- plate caption -->
  <text class="title txt" x="508" y="74">Pilha</text>
  <text class="mono-mut small" x="558" y="74">3 itens</text>
  <text class="mono small ocean-txt" x="612" y="74">· push(30)</text>
  <text class="mono-mut small" x="929" y="74" text-anchor="end">automático ▾</text>
  <circle cx="948" cy="70" r="3" fill="#9696A5"/>
  <text class="mono-mut small" x="958" y="74">pausado</text>
  <text class="mut small" x="1108" y="74">⋯</text>
  <line class="hair" x1="480" y1="92" x2="1140" y2="92"/>

  <!-- canvas grid -->
  <g class="grid">
    <line x1="540" y1="92" x2="540" y2="812"/><line x1="600" y1="92" x2="600" y2="812"/>
    <line x1="660" y1="92" x2="660" y2="812"/><line x1="720" y1="92" x2="720" y2="812"/>
    <line x1="780" y1="92" x2="780" y2="812"/><line x1="840" y1="92" x2="840" y2="812"/>
    <line x1="900" y1="92" x2="900" y2="812"/><line x1="960" y1="92" x2="960" y2="812"/>
    <line x1="1020" y1="92" x2="1020" y2="812"/><line x1="1080" y1="92" x2="1080" y2="812"/>
    <line x1="480" y1="152" x2="1140" y2="152"/><line x1="480" y1="212" x2="1140" y2="212"/>
    <line x1="480" y1="272" x2="1140" y2="272"/><line x1="480" y1="332" x2="1140" y2="332"/>
    <line x1="480" y1="392" x2="1140" y2="392"/><line x1="480" y1="452" x2="1140" y2="452"/>
    <line x1="480" y1="512" x2="1140" y2="512"/><line x1="480" y1="572" x2="1140" y2="572"/>
    <line x1="480" y1="632" x2="1140" y2="632"/><line x1="480" y1="692" x2="1140" y2="692"/>
    <line x1="480" y1="752" x2="1140" y2="752"/>
  </g>

  <!-- stack -->
  <rect class="cell-active" x="700" y="288" width="220" height="58" rx="4"/>
  <text class="mono-mut small" x="716" y="322">[2]</text>
  <text class="mono ocean-txt" x="790" y="323" font-size="17" font-weight="600">30</text>
  <text class="mono ocean-txt small" x="842" y="322">← topo</text>

  <rect class="cell" x="700" y="346" width="220" height="58" rx="4"/>
  <text class="mono-mut small" x="716" y="380">[1]</text>
  <text class="mono" x="790" y="381" font-size="17" font-weight="600">20</text>

  <rect class="cell" x="700" y="404" width="220" height="58" rx="4"/>
  <text class="mono-mut small" x="716" y="438">[0]</text>
  <text class="mono" x="790" y="439" font-size="17" font-weight="600">10</text>

  <text class="mono-mut small" x="810" y="488" text-anchor="middle">BASE</text>
  <text class="mono-mut small" x="810" y="560" text-anchor="middle">a linha 9 muda o topo; o desenho permanece o mesmo</text>

  <!-- step caption -->
  <line class="hair" x1="480" y1="812" x2="1140" y2="812"/>
  <rect x="480" y="812" width="660" height="40" fill="#0D0D12"/>
  <circle cx="500" cy="832" r="3" fill="#35B8C8"/>
  <text class="label" x="512" y="836">PASSO</text>
  <text class="sec body" x="568" y="836">push(30) · 30 entrou no topo. A pilha passou de 2 para 3 itens.</text>

  <!-- ruler -->
  <rect x="480" y="852" width="660" height="48" fill="#0D0D12"/>
  <line class="hair" x1="480" y1="852" x2="1140" y2="852"/>
  <text class="mut" x="500" y="880">⏮</text>
  <text class="mut" x="524" y="880">◀</text>
  <circle cx="558" cy="876" r="14" fill="#35B8C8"/>
  <text x="558" y="881" text-anchor="middle" fill="#09090D" font-size="11">▶</text>
  <text class="mut" x="586" y="880">▶</text>
  <text class="mut" x="610" y="880">⏭</text>
  <text class="mono-mut small" x="646" y="880">5/10</text>
  <line x1="692" y1="876" x2="984" y2="876" stroke="#292936" stroke-width="3" stroke-linecap="round"/>
  <line x1="692" y1="876" x2="812" y2="876" stroke="#35B8C8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="812" cy="876" r="6" fill="#35B8C8"/>
  <text class="mono-mut small" x="1010" y="880">1×</text>
  <text class="mono small ocean-txt" x="1068" y="880">Registro ↑</text>

  <!-- 3 · margin -->
  <rect class="surface" x="1140" y="44" width="300" height="856"/>
  <line class="hair" x1="1140" y1="44" x2="1140" y2="900"/>
  <text class="label" x="1160" y="62">LEITURA</text>
  <text class="mono-mut small" x="1326" y="62">passo 5/10</text>
  <text class="mut small" x="1416" y="62">›</text>
  <line class="hair" x1="1140" y1="76" x2="1440" y2="76"/>

  <text class="label" x="1160" y="100">PASSO</text>
  <text class="mono ocean-txt small" x="1160" y="120">push(30)</text>
  <text class="sec body" x="1160" y="142">30 entrou no topo. A pilha</text>
  <text class="sec body" x="1160" y="158">passou de 2 para 3 itens.</text>
  <rect x="1160" y="174" width="260" height="30" rx="4" class="bg"/>
  <text class="code-mut" x="1172" y="193">9</text>
  <text class="code" x="1190" y="193">pilha.push(30);</text>
  <line class="hair" x1="1140" y1="222" x2="1440" y2="222"/>

  <text class="label" x="1160" y="248">CONTEXTO</text>
  <text class="txt small" x="1160" y="276">Variáveis</text>
  <text class="mono-mut small" x="1244" y="276">2</text>
  <line x1="1156" y1="264" x2="1156" y2="284" stroke="#35B8C8" stroke-width="2"/>
  <text class="mut small" x="1160" y="304">Chamadas</text>
  <text class="mono-mut small" x="1244" y="304">0</text>
  <text class="mut small" x="1160" y="332">Estrutura</text>
  <line class="hair" x1="1140" y1="360" x2="1440" y2="360"/>

  <text class="label" x="1160" y="402">VARIÁVEIS</text>
  <text class="mono" x="1160" y="428">▾ pilha</text>
  <text class="mono-mut small" x="1400" y="428" text-anchor="end">Array(3)</text>
  <text class="mono-mut" x="1182" y="450">0</text>
  <text class="mono" x="1214" y="450">10</text>
  <text class="mono-mut" x="1182" y="472">1</text>
  <text class="mono" x="1214" y="472">20</text>
  <text class="mono-mut" x="1182" y="494">2</text>
  <text class="mono ocean-txt" x="1214" y="494">30</text>
  <text class="mono" x="1160" y="522">▸ this</text>
  <text class="mono-mut small" x="1400" y="522" text-anchor="end">Pilha</text>

  <line class="hair" x1="1140" y1="812" x2="1440" y2="812"/>
  <text class="label" x="1160" y="836">LEGENDA</text>
  <circle cx="1166" cy="856" r="4" fill="#12343A" stroke="#35B8C8" stroke-width="1.3"/>
  <text class="mut small" x="1178" y="860">ativo</text>
  <circle cx="1230" cy="856" r="4" fill="#111118" stroke="#393947" stroke-width="1.3"/>
  <text class="mut small" x="1242" y="860">visitado</text>
  <circle cx="1318" cy="856" r="4" fill="none" stroke="#393947" stroke-dasharray="2 2"/>
  <text class="mut small" x="1330" y="860">pendente</text>

  <!-- legend -->
  <rect class="panel" x="0" y="900" width="1440" height="20"/>
  <text class="mono-mut small" x="18" y="914">1 ROTEIRO</text>
  <text class="mono-mut small" x="492" y="914">2 PRANCHA</text>
  <text class="mono-mut small" x="1152" y="914">3 MARGEM</text>
  <text class="mono-mut small" x="1268" y="914">4 RÉGUA</text>
</svg>
